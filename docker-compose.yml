services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        RUBY_VERSION: ${RUBY_VERSION:?Use bin/docker-dev to read .ruby-version}
    environment:
      RAILS_ENV: development
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
      - node_modules:/rails/node_modules
      - storage:/rails/storage
    command: >-
      bash -ec "bundle check || bundle install;
      npm ci && rm -f tmp/pids/server.pid &&
      ./bin/rails db:prepare && exec ./bin/rails server -b 0.0.0.0"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/up"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
volumes:
  bundle:
  node_modules:
  storage:
